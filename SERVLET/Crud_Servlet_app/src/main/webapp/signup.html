<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMS Signup</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="min-h-screen flex">

    <!-- LEFT IMAGE -->
    <div class="hidden lg:block lg:w-1/2 bg-cover bg-center"
         style="background-image: url('https://images.unsplash.com/photo-1556761175-4b46a572b786');">
    </div>

    <!-- RIGHT FORM -->
    <div class="w-full lg:w-1/2 flex items-center justify-center bg-white">
        <div class="w-full max-w-md p-8">

            <h2 class="text-2xl font-bold text-gray-800 mb-1">Create Account</h2>
            <p class="text-gray-500 mb-6">Register to access EMS</p>



            <form class="space-y-4" action="signup" method="post">

                <!-- Full Name -->
                <div>
                    <label class="block text-sm font-medium text-gray-600">Full Name</label>
                    <input type="text" name="fullname" required
                           class="w-full mt-1 px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none">
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-600">Email</label>
                    <input type="email" name="email" required
                           class="w-full mt-1 px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none">
                </div>

                <!-- Age -->
                <div>
                    <label class="block text-sm font-medium text-gray-600">Age</label>
                    <input type="number" name="age" min="18" required
                           class="w-full mt-1 px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none">
                </div>

                <!-- Gender Dropdown -->
                <div>
                    <label class="block text-sm font-medium text-gray-600">Gender</label>
                    <select name="gender" required
                            class="w-full mt-1 px-4 py-2 border rounded-md bg-white focus:ring-2 focus:ring-green-500 focus:outline-none">
                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <!-- Address -->
                <div>
                    <label class="block text-sm font-medium text-gray-600">Address</label>
                    <textarea name="address" rows="2" required
                              class="w-full mt-1 px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none"></textarea>
                </div>

                <!-- Salary -->
                <div>
                    <label class="block text-sm font-medium text-gray-600">Salary</label>
                    <input type="number" name="salary" required
                           class="w-full mt-1 px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-600">Password</label>
                    <input type="password" name="password" required
                           class="w-full mt-1 px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none">
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-600">Confirm Password</label>
                    <input type="password" name="cpassword" required
                           class="w-full mt-1 px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none">
                </div>

                <!-- Submit -->
                <button
                        class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 transition">
                    Register Employee
                </button>

            </form>


            <p class="text-sm text-center text-gray-500 mt-4">
                Already have an account?
                <a href="login.html" class="text-green-600 font-medium">Login</a>
            </p>

        </div>
    </div>

</div>

</body>
</html>
