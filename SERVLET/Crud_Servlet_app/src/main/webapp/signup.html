<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Signup | EMS</title>

    <!-- Mobile first -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', system-ui, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #4ade80, transparent 60%),
                linear-gradient(135deg, #064e3b, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            box-shadow: 0 30px 60px rgba(0,0,0,.25);
        }

        /* LEFT INFO */
        .left {
            background: linear-gradient(160deg, #16a34a, #4ade80);
            color: #022c22;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .left p {
            font-size: 15px;
            line-height: 1.6;
            opacity: 0.9;
        }

        /* RIGHT FORM */
        .right {
            padding: 40px 35px;
        }

        .right h2 {
            font-size: 26px;
            color: #065f46;
            margin-bottom: 6px;
        }

        .right p {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field.full {
            grid-column: span 2;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #374151;
        }

        input, select, textarea {
            padding: 12px 13px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            font-size: 14px;
            outline: none;
            transition: .2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34,197,94,.25);
        }

        textarea {
            resize: none;
            height: 70px;
        }

        .upload {
            border: 2px dashed #22c55e;
            padding: 18px;
            text-align: center;
            border-radius: 12px;
            background: #ecfdf5;
            color: #065f46;
            font-size: 14px;
            cursor: pointer;
        }

        .upload input {
            border: none;
            padding: 0;
            margin-top: 8px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: .25s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(34,197,94,.45);
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .footer a {
            color: #16a34a;
            font-weight: 600;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .card {
                grid-template-columns: 1fr;
            }
            .left {
                text-align: center;
            }
        }

        @media (max-width: 520px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .field.full {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

<div class="card">

    <!-- LEFT -->
    <div class="left">
        <h1>Welcome to EMS</h1>
        <p>
            Employee Management System helps you track attendance,
            manage leaves, view payroll and stay connected —
            all in one secure platform.
        </p>
    </div>

    <!-- RIGHT -->
    <div class="right">

        <h2>Create Account</h2>
        <p>Fill in your details to get started</p>

        <!-- multipart REQUIRED -->
        <form action="signup" method="post" enctype="multipart/form-data">

            <div class="grid">

                <div class="field">
                    <label>Full Name</label>
                    <input type="text" name="fullname" required>
                </div>

                <div class="field">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>

                <div class="field">
                    <label>Age</label>
                    <input type="number" name="age" required>
                </div>

                <div class="field">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="">Select</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="field full">
                    <label>Address</label>
                    <textarea name="address" required></textarea>
                </div>

                <div class="field">
                    <label>Salary</label>
                    <input type="number" step="0.01" name="salary" required>
                </div>

                <div class="field">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>

                <div class="field full upload">
                    <label>Profile Image</label>
                    <input type="file" name="profileImage" accept="image/*" required>
                </div>

            </div>

            <button class="btn">Create Account</button>

        </form>

        <div class="footer">
            Already registered?
            <a href="login.html">Login</a>
        </div>

    </div>

</div>

</body>
</html>
